name: Autopsy QNXProbe fresh Windows build

on:
  push:
    branches: [develop, feature/nand-preprocessor-gui]
    paths:
      - '.github/workflows/autopsy-qnxprobe-fresh.yml'
      - 'Core/src/org/sleuthkit/autopsy/casemodule/**'
      - 'Core/build.xml'
      - 'Tools/nand/**'
      - 'tests/nand/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 180
    env:
      TSK_HOME: ${{ github.workspace }}\\sleuthkit
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout Autopsy
        uses: actions/checkout@v4
      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'
      - name: Verify Java 17 build environment
        shell: pwsh
        run: |
          java -version
          javac -version
          if ($LASTEXITCODE -ne 0) { throw 'Java compiler unavailable' }
          if (-not ((& javac -version 2>&1) -match 'javac 17[.]')) { throw 'Expected JDK 17 for Autopsy build' }
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install tools
        shell: pwsh
        run: |
          choco install nuget.commandline -y
          if ($LASTEXITCODE -ne 0) { throw 'nuget installation failed' }
          choco install ant --ignore-dependencies -y
          if ($LASTEXITCODE -ne 0) { throw 'ant installation failed' }
      - name: Checkout merged Sleuth Kit
        shell: pwsh
        run: |
          git clone --depth 1 --branch develop-4.1x https://github.com/Gerd1986/sleuthkit.git "$env:TSK_HOME"
          if ($LASTEXITCODE -ne 0) { throw 'Sleuth Kit checkout failed' }
          $expected = 'f4bf2eacfecc772ce2b1905080c5a86eb81df8df'
          git -C "$env:TSK_HOME" fetch --depth 1 origin $expected
          if ($LASTEXITCODE -ne 0) { throw 'Pinned Sleuth Kit fetch failed' }
          git -C "$env:TSK_HOME" checkout --detach $expected
          if ($LASTEXITCODE -ne 0) { throw 'Pinned Sleuth Kit checkout failed' }
          $actual = git -C "$env:TSK_HOME" rev-parse HEAD
          if ($actual -ne $expected) { throw "Expected merged Sleuth Kit $expected, got $actual; update the build revision before retrying" }
          "CUSTOM_TSK_REVISION=$actual" >> $env:GITHUB_ENV
          "JDK_HOME=$env:JAVA_HOME" >> $env:GITHUB_ENV
          "INCLUDE=$env:INCLUDE;$env:JAVA_HOME/include;$env:JAVA_HOME/include/win32" >> $env:GITHUB_ENV
      - name: Build native Sleuth Kit
        shell: pwsh
        working-directory: ${{ env.TSK_HOME }}
        run: |
          python win32/updateAndBuildAll.py -m
          if ($LASTEXITCODE -ne 0) { throw 'Native Sleuth Kit build failed' }
          if (-not (Test-Path win32/x64/Release/libtsk_jni.dll)) { throw 'Missing Windows JNI DLL' }
      - name: Record merged Sleuth Kit source revision
        shell: pwsh
        run: |
          git -C "$env:TSK_HOME" log -1 --format="%H %s"
          if ($LASTEXITCODE -ne 0) { throw 'Unable to identify Sleuth Kit source revision' }
      - name: Test QNX6 NFI fixture
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git clone --depth 1 https://github.com/NetherlandsForensicInstitute/qnxmount.git "$env:RUNNER_TEMP/qnxmount"
          if ($LASTEXITCODE -ne 0) { throw 'NFI fixture checkout failed' }
          $fixture = Join-Path $env:RUNNER_TEMP 'qnxmount/tests/qnx6/test_data/test_image.bin'
          if (-not (Test-Path $fixture)) { throw 'NFI QNX6 fixture missing' }
          $fsstat = @(Get-ChildItem "$env:TSK_HOME/win32" -Recurse -File -Filter fsstat.exe)
          $fls = @(Get-ChildItem "$env:TSK_HOME/win32" -Recurse -File -Filter fls.exe)
          if ($fsstat.Count -eq 0 -or $fls.Count -eq 0) { throw 'Native Sleuth Kit test utilities missing' }
          $env:PATH = ((Get-ChildItem "$env:TSK_HOME/win32" -Recurse -File -Filter '*.dll' | ForEach-Object DirectoryName | Sort-Object -Unique) -join ';') + ';' + $env:PATH
          Write-Host 'QNX6 is explicitly selected because this Sleuth Kit branch marks its reader as explicit-selection-only.'
          & $fsstat[0].FullName $fixture
          if ($LASTEXITCODE -ne 0) { throw 'Automatic QNX6 fsstat detection failed' }
          & $fls[0].FullName -r -p $fixture
          if ($LASTEXITCODE -ne 0) { throw 'Automatic QNX6 fls enumeration failed' }
          & $fsstat[0].FullName -f qnx6 $fixture
          if ($LASTEXITCODE -ne 0) { throw 'Explicit QNX6 fsstat failed' }
      - name: Compare QNXProbe reference traversal
        shell: pwsh
        run: |
          git clone --depth 1 --branch main https://github.com/Gerd1986/qnxprobe.git "$env:RUNNER_TEMP/qnxprobe-reference"
          if ($LASTEXITCODE -ne 0) { throw 'QNXProbe checkout failed' }
          @'
          import sys
          from pathlib import Path
          sys.path.insert(0, str(Path(sys.argv[1])))
          from qnxprobe import Qnx6Walker
          image = Path(sys.argv[2])
          with image.open("rb") as fh:
              walker = Qnx6Walker(fh, 0, 0x2000)
              print("QNXProbe root inode:", walker.inode(1))
              print("QNXProbe root directory:", walker.listdir(1))
              seen = set()
              pending = [("", 1)]
              files = 0
              while pending:
                  parent, ino = pending.pop()
                  if ino in seen:
                      continue
                  seen.add(ino)
                  entries = walker.listdir(ino)
                  print("QNXProbe directory:", repr(parent or "/"), ino, entries)
                  for name, child in entries:
                      path = (parent + "/" + name) if parent else ("/" + name)
                      meta = walker.entry(child)
                      print("QNXProbe entry:", repr(path), child, meta)
                      if meta is None:
                          continue
                      if (meta[0] & 0o170000) == 0o040000:
                          pending.append((path, child))
                      elif (meta[0] & 0o170000) == 0o100000:
                          files += 1
              print("QNXProbe regular file count:", files)
              if files == 0:
                  print("WARNING: QNXProbe found no regular files in the selected superblock generation")
          import tarfile
          archive = image.with_name("test_image.tar.gz")
          if archive.exists():
              with tarfile.open(archive, "r:gz") as tar:
                  names = [m.name for m in tar.getmembers() if m.isfile()]
                  print("NFI archive regular files:", len(names), names[:40])
          from qnxprobe import sb_slots, check
          size = image.stat().st_size
          print("NFI image bytes:", size)
          valid = []
          with image.open("rb") as fh:
              for off, rel in sb_slots(fh, 0, "NFI", [("NFI", 0, size)]):
                  result = check(fh, off)
                  if result is None:
                      print("QNXProbe superblock slot:", hex(off), "no magic")
                      continue
                  endian, sb, bad = result
                  print("QNXProbe superblock slot:", hex(off), "endian:", endian, "serial:", sb.get("serial"), "blocksize:", sb.get("blocksize"), "bad:", bad)
                  if bad:
                      continue
                  valid.append((sb["serial"], off))
          for serial, off in sorted(valid, reverse=True):
              try:
                  with image.open("rb") as fh:
                      other = Qnx6Walker(fh, 0, off)
                      print("QNXProbe valid generation:", serial, hex(off), "root:", other.inode(1), "entries:", other.listdir(1))
              except Exception as exc:
                  print("QNXProbe valid generation error:", serial, hex(off), repr(exc))
          '@ | Set-Content -Path "$env:RUNNER_TEMP/qnx6_reference.py" -Encoding utf8
          python "$env:RUNNER_TEMP/qnx6_reference.py" "$env:RUNNER_TEMP/qnxprobe-reference" "$env:RUNNER_TEMP/qnxmount/tests/qnx6/test_data/test_image.bin"
          if ($LASTEXITCODE -ne 0) { throw 'QNXProbe reference traversal failed' }
      - name: Diagnose QNX6 root inode and directory traversal
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $image = Join-Path $env:RUNNER_TEMP 'qnxmount/tests/qnx6/test_data/test_image.bin'
          $env:PATH = ((Get-ChildItem "$env:TSK_HOME/win32" -Recurse -File -Filter '*.dll' | ForEach-Object DirectoryName | Sort-Object -Unique) -join ';') + ';' + $env:PATH
          foreach ($tool in @('fsstat', 'istat', 'fls')) {
            $exe = @(Get-ChildItem "$env:TSK_HOME/win32" -Recurse -File -Filter "$tool.exe" | Select-Object -First 1)
            if ($exe.Count -eq 0) { throw "Missing $tool.exe" }
            Write-Host "=== $tool ==="
            if ($tool -eq 'istat') { & $exe[0].FullName -f qnx6 $image 1 }
            elseif ($tool -eq 'fls') { & $exe[0].FullName -f qnx6 -l -r -p $image }
            else { & $exe[0].FullName -f qnx6 $image }
            Write-Host "$tool exit code: $LASTEXITCODE"
          }
      - name: Verify QNX6 file bytes against NFI archive
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $data = Join-Path $env:RUNNER_TEMP 'qnxmount/tests/qnx6/test_data'
          $image = Join-Path $data 'test_image.bin'
          $archive = Join-Path $data 'test_image.tar.gz'
          $fls = @(Get-ChildItem "$env:TSK_HOME/win32" -Recurse -File -Filter fls.exe | Select-Object -First 1)
          $icat = @(Get-ChildItem "$env:TSK_HOME/win32" -Recurse -File -Filter icat.exe | Select-Object -First 1)
          if ($fls.Count -ne 1 -or $icat.Count -ne 1) { throw 'Missing fls.exe or icat.exe' }
          if (-not (Test-Path $archive)) { throw 'NFI reference tarball missing' }
          $env:PATH = ((Get-ChildItem "$env:TSK_HOME/win32" -Recurse -File -Filter '*.dll' | ForEach-Object DirectoryName | Sort-Object -Unique) -join ';') + ';' + $env:PATH
          python tests/qnx6/verify_nfi_bytes.py $image $archive $fls[0].FullName $icat[0].FullName
          if ($LASTEXITCODE -ne 0) { throw 'QNX6 byte comparison failed' }
      - name: Verify QNX6 partition inside MBR disk image
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $data = Join-Path $env:RUNNER_TEMP 'qnxmount/tests/qnx6/test_data'
          $partition = Join-Path $data 'test_image.bin'
          $archive = Join-Path $data 'test_image.tar.gz'
          $disk = Join-Path $env:RUNNER_TEMP 'qnx6-nfi-mbr.img'
          python tests/qnx6/wrap_nfi_mbr.py $partition $disk
          if ($LASTEXITCODE -ne 0) { throw 'MBR fixture creation failed' }
          $env:PATH = ((Get-ChildItem "$env:TSK_HOME/win32" -Recurse -File -Filter '*.dll' | ForEach-Object DirectoryName | Sort-Object -Unique) -join ';') + ';' + $env:PATH
          $mmls = @(Get-ChildItem "$env:TSK_HOME/win32" -Recurse -File -Filter mmls.exe | Select-Object -First 1)
          $fls = @(Get-ChildItem "$env:TSK_HOME/win32" -Recurse -File -Filter fls.exe | Select-Object -First 1)
          $icat = @(Get-ChildItem "$env:TSK_HOME/win32" -Recurse -File -Filter icat.exe | Select-Object -First 1)
          if ($mmls.Count -ne 1 -or $fls.Count -ne 1 -or $icat.Count -ne 1) { throw 'Missing TSK MBR verification tools' }
          $layout = & $mmls[0].FullName $disk
          $layout | ForEach-Object { Write-Host $_ }
          if ($LASTEXITCODE -ne 0) { throw 'mmls could not parse MBR' }
          if (-not ($layout -match '2048')) { throw 'mmls did not identify partition at LBA 2048' }
          if (-not ($layout -match 'QNX6 Power-Safe \(0xb2\)')) { throw 'mmls did not identify QNX6 Power-Safe type 0xB2' }
          python tests/qnx6/verify_nfi_bytes.py --offset-sectors 2048 $disk $archive $fls[0].FullName $icat[0].FullName
          if ($LASTEXITCODE -ne 0) { throw 'MBR-wrapped QNX6 byte comparison failed' }
          Write-Host 'PASS: MBR partition detected and 23 QNX6 files verified byte-for-byte'
      - name: Verify QNX6 unallocated bitmap via blkls
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $disk = Join-Path $env:RUNNER_TEMP 'qnx6-nfi-mbr.img'
          $blkls = @(Get-ChildItem "$env:TSK_HOME/win32" -Recurse -File -Filter blkls.exe | Select-Object -First 1)
          if ($blkls.Count -ne 1) { throw 'Missing blkls.exe' }
          $env:PATH = ((Get-ChildItem "$env:TSK_HOME/win32" -Recurse -File -Filter '*.dll' | ForEach-Object DirectoryName | Sort-Object -Unique) -join ';') + ';' + $env:PATH
          $output = Join-Path $env:RUNNER_TEMP 'qnx6-unallocated.bin'
          # Redirect native stdout without PowerShell's text encoding transformations.
          $proc = Start-Process -FilePath $blkls[0].FullName -ArgumentList @('-f','qnx6','-o','2048',$disk) -Wait -PassThru -NoNewWindow -RedirectStandardOutput $output
          if ($proc.ExitCode -ne 0) { throw "blkls failed with exit code $($proc.ExitCode)" }
          $bytes = (Get-Item $output).Length
          Write-Host "QNX6 unallocated output bytes: $bytes"
          if ($bytes -le 0) { throw 'No unallocated blocks extracted; inspect QNX6 bitmap interpretation' }
          if ($bytes % 1024 -ne 0) { throw 'Unallocated output not aligned to NFI QNX6 1024-byte block size' }
          Write-Host "PASS: blkls extracted $($bytes / 1024) unallocated QNX6 blocks"
      - name: Upload MBR-wrapped QNX6 test image
        uses: actions/upload-artifact@v4
        with:
          name: qnx6-nfi-mbr-test-image
          path: ${{ runner.temp }}/qnx6-nfi-mbr.img
          if-no-files-found: error
      - name: Build custom Java JAR
        shell: pwsh
        working-directory: ${{ env.TSK_HOME }}\\bindings\\java
        run: |
          ant clean
          if ($LASTEXITCODE -ne 0) { throw 'Ant clean failed' }
          ant dist
          if ($LASTEXITCODE -ne 0) { throw 'Ant dist failed' }
          $jar = 'dist/sleuthkit-4.15.0.jar'
          if (-not (Test-Path $jar)) { throw 'Custom JAR not built' }
          $entries = & jar tf $jar
          if ($LASTEXITCODE -ne 0 -or -not ($entries -contains 'NATIVELIBS/amd64/win/libtsk_jni.dll')) { throw 'Windows JNI missing from JAR' }
          "CUSTOM_TSK_JAR=$((Resolve-Path $jar).Path)" >> $env:GITHUB_ENV
      - name: Build case-uco
        shell: pwsh
        working-directory: ${{ env.TSK_HOME }}\\case-uco\\java
        run: |
          ant
          if ($LASTEXITCODE -ne 0) { throw 'case-uco build failed' }
      - name: Restore JNA Java dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = '5.18.1'
          foreach ($module in @('CoreLibs','Core')) {
            $dir = Join-Path $module 'release/modules/ext'
            New-Item -ItemType Directory -Force -Path $dir | Out-Null
            foreach ($artifact in @('jna','jna-platform')) {
              $dest = Join-Path $dir "$artifact-$version.jar"
              $url = "https://repo.maven.apache.org/maven2/net/java/dev/jna/$artifact/$version/$artifact-$version.jar"
              Invoke-WebRequest -Uri $url -OutFile $dest
              if ((Get-Item $dest).Length -lt 10000) { throw "Invalid dependency: $dest" }
              Write-Host "Restored $dest"
            }
          }
      - name: Test NAND preprocessing bridge
        shell: pwsh
        run: |
          python tests/nand/test_bridge.py
          if ($LASTEXITCODE -ne 0) { throw 'NAND preprocessing bridge tests failed' }
      - name: Bundle isolated Python runtime for NAND preprocessing
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $homeDir = python -c "import sys; print(sys.base_prefix)"
          if ($LASTEXITCODE -ne 0) { throw 'Cannot locate Python runtime' }
          $dest = 'Tools/nand/python'
          New-Item -ItemType Directory -Force -Path "$dest/Lib" | Out-Null
          Copy-Item "$homeDir/python.exe", "$homeDir/python3.dll", "$homeDir/python310.dll", "$homeDir/vcruntime*.dll" $dest
          Copy-Item "$homeDir/DLLs" $dest -Recurse
          Get-ChildItem "$homeDir/Lib" | Where-Object { $_.Name -notin @('site-packages','__pycache__','test','idlelib','tkinter','ensurepip') } | Copy-Item -Destination "$dest/Lib" -Recurse
          @('python310.zip','.','..','DLLs','Lib') | Set-Content "$dest/python310._pth" -Encoding ascii
          Get-ChildItem $homeDir -File -Filter 'LICENSE*' | Copy-Item -Destination $dest
          & "$dest/python.exe" -I Tools/nand/preprocess_ubi.py --list-profiles
          if ($LASTEXITCODE -ne 0) { throw 'Bundled NAND Python runtime failed' }
      - name: Build Autopsy ZIP
        shell: pwsh
        run: |
          ant build-zip
          if ($LASTEXITCODE -ne 0) { throw 'Autopsy build-zip failed' }
      - name: Bundle portable Java runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $dirs = @(Get-ChildItem dist -Directory -Filter 'autopsy-*')
          if ($dirs.Count -ne 1) { throw 'Expected one Autopsy distribution' }
          $runtime = Join-Path $dirs[0].FullName 'jre'
          if (Test-Path $runtime) { Remove-Item $runtime -Recurse -Force }
          & "$env:JAVA_HOME/bin/jlink.exe" --add-modules ALL-MODULE-PATH --output $runtime --no-man-pages --no-header-files --compress=2
          if ($LASTEXITCODE -ne 0) { throw 'Portable Java runtime creation failed' }
          $conf = Join-Path $dirs[0].FullName 'etc/autopsy.conf'
          $text = Get-Content $conf -Raw
          $text = $text -replace '(?m)^jdkhome=.*$', 'jdkhome="jre"'
          if ($text -notmatch '(?m)^jdkhome=') { $text += "`r`njdkhome=`"jre`"`r`n" }
          Set-Content $conf -Value $text -Encoding utf8
          & "$runtime/bin/java.exe" -version
          if ($LASTEXITCODE -ne 0) { throw 'Bundled Java does not run' }
      - name: Inject custom JAR into Autopsy distribution
        shell: pwsh
        run: |
          $dirs = @(Get-ChildItem dist -Directory -Filter 'autopsy-*')
          if ($dirs.Count -ne 1) { throw "Expected one distribution folder, got $($dirs.Count)" }
          $ext = Join-Path $dirs[0].FullName 'autopsy/modules/ext'
          if (-not (Test-Path $ext)) { throw "Autopsy modules/ext missing: $ext" }
          $candidates = @(Get-ChildItem $ext -File -Filter '*.jar' | Where-Object { $_.Name -match '(?i)sleuth|datamodel|tsk' })
          $candidates | ForEach-Object { Write-Host "Sleuth Kit candidate: $($_.Name)" }
          $target = @(Get-ChildItem $ext -File | Where-Object { $_.Name -eq 'sleuthkit-4.15.0.jar' })
          if ($target.Count -ne 1) {
            throw "Expected exactly one Sleuth Kit JAR in $ext; found $($target.Count). Candidates: $($candidates.Name -join ', ')"
          }
          $nand = Join-Path $dirs[0].FullName 'autopsy/nand'
          if (-not (Test-Path "$nand/profiles/qualcomm-kommbox-4352.json")) { throw 'Packaged NAND profile missing' }
          & "$nand/python/python.exe" "$nand/preprocess_ubi.py" --list-profiles
          if ($LASTEXITCODE -ne 0) { throw 'Packaged NAND preprocessor failed' }
          $targetJar = $target[0].FullName
          Write-Host "Replacing $targetJar"
          Copy-Item -LiteralPath $env:CUSTOM_TSK_JAR -Destination $targetJar -Force
          if ((Get-FileHash $env:CUSTOM_TSK_JAR -Algorithm SHA256).Hash -ne (Get-FileHash $targetJar -Algorithm SHA256).Hash) { throw 'Packaged JAR hash mismatch' }
          $entries = & jar tf $targetJar
          if ($LASTEXITCODE -ne 0 -or -not ($entries -contains 'NATIVELIBS/amd64/win/libtsk_jni.dll')) { throw 'Packaged JAR missing Windows JNI' }
          Compress-Archive -Path $dirs[0].FullName -DestinationPath dist/autopsy-qnxprobe-windows.zip -Force
          if (-not (Test-Path dist/autopsy-qnxprobe-windows.zip)) { throw 'Distribution ZIP missing' }
      - name: Smoke-test packaged Sleuth Kit JNI
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $dirs = @(Get-ChildItem dist -Directory -Filter 'autopsy-*')
          if ($dirs.Count -ne 1) { throw 'Distribution missing for JNI smoke test' }
          $ext = Join-Path $dirs[0].FullName 'autopsy/modules/ext'
          $jar = Join-Path $ext 'sleuthkit-4.15.0.jar'
          if (-not (Test-Path $jar)) { throw 'Packaged Sleuth Kit JAR missing' }
          @'
          import os, pathlib, sys
          sys.path.insert(0, str(pathlib.Path(os.environ['TSK_HOME']) / 'tests'))
          from ftl100_fixture import fat12, encode
          logical, _ = fat12()
          dest = pathlib.Path(os.environ['RUNNER_TEMP'])
          (dest / 'ftl100-jni-expected.img').write_bytes(logical)
          (dest / 'ftl100-jni-nor.bin').write_bytes(encode(logical, prefix=0xf40000))
          '@ | Set-Content -Path "$env:RUNNER_TEMP/ftl100_jni_fixture.py" -Encoding utf8
          python "$env:RUNNER_TEMP/ftl100_jni_fixture.py"
          if ($LASTEXITCODE -ne 0) { throw 'FTL100 JNI fixture generation failed' }
          $src = Join-Path $env:RUNNER_TEMP 'QnxprobeJniSmoke.java'
          @'
          import org.sleuthkit.datamodel.SleuthkitJNI;
          import org.sleuthkit.datamodel.SleuthkitCase;
          public class QnxprobeJniSmoke {
              public static void main(String[] args) throws Exception {
                  String version = SleuthkitJNI.getVersion();
                  if (version == null || version.isBlank()) {
                      throw new IllegalStateException("Empty native Sleuth Kit version");
                  }
                  System.out.println("Loaded native Sleuth Kit JNI version: " + version);
                  byte[] expected = java.nio.file.Files.readAllBytes(java.nio.file.Path.of(args[1]));
                  java.nio.file.Path caseDir = java.nio.file.Files.createTempDirectory("ftl100-jni-case-");
                  SleuthkitCase skCase = SleuthkitCase.newCase(caseDir.resolve("autopsy.db").toString());
                  try {
                      long image = SleuthkitJNI.openImage(new String[] {args[0]}, skCase);
                      byte[] actual = new byte[expected.length];
                      int count = SleuthkitJNI.readImg(image, actual, 0, actual.length);
                      if (count != expected.length || !java.util.Arrays.equals(expected, actual)) {
                          throw new IllegalStateException("Packaged JNI FTL100 autodetection/recovery mismatch");
                      }
                      System.out.println("Packaged JNI: late-header FTL100 autodetection and complete logical image verified");
                  } finally {
                      skCase.close();
                  }
              }
          }
          '@ | Set-Content -Path $src -Encoding utf8
          $cp = "$ext/*"
          $native = Join-Path $ext 'sleuthkit-4.15.0.jar'
          $nativeEntries = & jar tf $native
          Write-Host "JNI entries: $($nativeEntries | Where-Object { $_ -like '*libtsk_jni.dll' })"
          Write-Host "Java architecture: $(& java -XshowSettings:properties -version 2>&1 | Select-String 'os.arch|java.version')"
          $dlls = @(Get-ChildItem $dirs[0].FullName -Recurse -File -Filter '*.dll')
          Write-Host "Packaged DLLs: $($dlls.Count)"
          $dlls | Where-Object { $_.Name -match '(?i)tsk|ewf|aff|zlib|sqlite|crypto|ssl|vcruntime|msvcp' } | ForEach-Object { Write-Host "Native dependency: $($_.FullName)" }
          $nativeDirs = @($dlls | ForEach-Object DirectoryName | Sort-Object -Unique)
          $env:PATH = ($nativeDirs -join ';') + ';' + $env:PATH
          & "$($dirs[0].FullName)/jre/bin/java.exe" --class-path $cp $src "$env:RUNNER_TEMP/ftl100-jni-nor.bin" "$env:RUNNER_TEMP/ftl100-jni-expected.img"
          if ($LASTEXITCODE -ne 0) { throw 'Packaged Sleuth Kit JNI runtime smoke test failed' }
      - name: Smoke-test Autopsy launcher with bundled Java
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $dir = @(Get-ChildItem dist -Directory -Filter 'autopsy-*')[0].FullName
          $launcher = Join-Path $dir 'bin/autopsy64.exe'
          if (-not (Test-Path $launcher)) { throw 'Autopsy launcher missing' }
          $userdir = Join-Path $env:RUNNER_TEMP 'autopsy-launch-test'
          $proc = Start-Process $launcher -WorkingDirectory $dir -ArgumentList @('--jdkhome', "`"$dir/jre`"", '--userdir', "`"$userdir`"", '--nosplash') -PassThru
          Start-Sleep -Seconds 30
          $proc.Refresh()
          if ($proc.HasExited) { throw "Autopsy launcher exited prematurely: $($proc.ExitCode)" }
          $log = Join-Path $userdir 'var/log/messages.log'
          if (-not (Test-Path $log)) { throw 'Autopsy launcher did not initialize application logging' }
          Get-Content $log -Tail 100
          Stop-Process -Id $proc.Id -Force
      - name: Upload Autopsy test distribution
        uses: actions/upload-artifact@v4
        with:
          name: autopsy-qnxprobe-windows-test
          path: dist/autopsy-qnxprobe-windows.zip
          if-no-files-found: error
      - name: Publish QNXProbe Windows release
        if: github.ref == 'refs/heads/develop'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = "autopsy-qnxprobe-win-${{ github.run_number }}"
          $zip = 'dist/autopsy-qnxprobe-windows.zip'
          if (-not (Test-Path $zip)) { throw "Missing release ZIP: $zip" }
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash
          $notes = "Unsigned Windows test build of Autopsy with custom QNXProbe Sleuth Kit 4.15.0 JNI JAR.`n`nCommit: ${{ github.sha }}`nSleuth Kit: $env:CUSTOM_TSK_REVISION (develop-4.1x; QNX6, QNX4, F2FS, OS-9 RBF, EFS, UBI/UBIFS, Datalight/Reliance, FTL100 full-dump autodetection; optional GUI NAND preprocessing with bundled Python)`nSHA256: $hash`n`nCase-UCO JAR is preserved."
          gh release create $tag $zip --repo "${{ github.repository }}" --target "${{ github.sha }}" --title "Autopsy QNXProbe Windows $tag" --notes $notes --prerelease
          if ($LASTEXITCODE -ne 0) { throw 'GitHub release publishing failed' }
