name: Build Autopsy Windows with QNXProbe

on:
  push:
    branches:
      - develop
    paths:
      - '.github/workflows/build-windows.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: autopsy-qnxprobe-windows-${{ github.ref }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  TSK_HOME: ${{ github.workspace }}\\sleuthkit

jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 180
    steps:
      - name: Checkout Autopsy
        uses: actions/checkout@v4

      - uses: microsoft/setup-msbuild@v2

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '21'

      - name: Configure JDK and JNI
        shell: pwsh
        run: |
          "JDK_HOME=$env:JAVA_HOME" >> $env:GITHUB_ENV
          "INCLUDE=$env:INCLUDE;$env:JAVA_HOME/include;$env:JAVA_HOME/include/win32" >> $env:GITHUB_ENV
          if (-not (Test-Path "$env:JAVA_HOME/include/jni.h")) { throw "Missing JDK JNI header" }

      - name: Install build tools
        shell: pwsh
        run: |
          choco install nuget.commandline -y
          if ($LASTEXITCODE -ne 0) { throw "NuGet installation failed" }
          choco install ant --ignore-dependencies -y
          if ($LASTEXITCODE -ne 0) { throw "Ant installation failed" }

      - name: Clone QNXProbe Sleuth Kit
        shell: pwsh
        run: |
          git clone --depth 1 --branch feature/qnxprobe-filesystems https://github.com/Gerd1986/sleuthkit "$env:TSK_HOME"
          if ($LASTEXITCODE -ne 0) { throw "Cannot clone Sleuth Kit feature branch" }

      - name: Build native Windows Sleuth Kit
        shell: pwsh
        working-directory: ${{ env.TSK_HOME }}
        run: |
          python win32/updateAndBuildAll.py -m
          if ($LASTEXITCODE -ne 0) { throw "Native Sleuth Kit build failed" }
          if (-not (Test-Path win32/x64/Release/libtsk_jni.dll)) { throw "Missing native Windows JNI DLL" }

      - name: Build Windows Sleuth Kit JAR
        shell: pwsh
        working-directory: ${{ env.TSK_HOME }}\\bindings\\java
        run: |
          ant clean
          if ($LASTEXITCODE -ne 0) { throw "Sleuth Kit clean failed" }
          ant dist
          if ($LASTEXITCODE -ne 0) { throw "Sleuth Kit JAR build failed" }
          $jar = "dist/sleuthkit-4.15.0.jar"
          if (-not (Test-Path $jar)) { throw "Missing Sleuth Kit JAR" }
          $entries = & jar tf $jar
          if ($LASTEXITCODE -ne 0 -or -not ($entries -contains "NATIVELIBS/amd64/win/libtsk_jni.dll")) { throw "Missing Windows JNI in JAR" }

      - name: Build case-uco Java
        shell: pwsh
        working-directory: ${{ env.TSK_HOME }}\\case-uco\\java
        run: |
          ant -q
          if ($LASTEXITCODE -ne 0) { throw "case-uco build failed" }

      - name: Build Autopsy distribution
        shell: pwsh
        run: |
          ant -q -Dbuild.type=RELEASE build-zip
          if ($LASTEXITCODE -ne 0) { throw "Autopsy build-zip failed" }

      - name: Replace packaged Sleuth Kit JAR and verify
        shell: pwsh
        run: |
          $customJar = Join-Path $env:TSK_HOME 'bindings/java/dist/sleuthkit-4.15.0.jar'
          $dirs = @(Get-ChildItem dist -Directory -Filter 'autopsy-*')
          if ($dirs.Count -ne 1) { throw "Expected one Autopsy distribution folder; found $($dirs.Count)" }
          $distDir = $dirs[0].FullName
          $ext = Join-Path $distDir 'autopsy/modules/ext'
          if (-not (Test-Path $ext)) { throw "Missing packaged Autopsy modules/ext directory" }
          $existing = @(Get-ChildItem $ext -File -Filter 'sleuthkit-*.jar')
          if ($existing.Count -ne 1) { throw "Expected exactly one Sleuth Kit JAR in Autopsy; found $($existing.Count)" }
          Copy-Item -LiteralPath $customJar -Destination $existing[0].FullName -Force
          if ((Get-FileHash $customJar -Algorithm SHA256).Hash -ne (Get-FileHash $existing[0].FullName -Algorithm SHA256).Hash) { throw "Packaged JAR differs from custom build" }
          $entries = & jar tf $existing[0].FullName
          if ($LASTEXITCODE -ne 0 -or -not ($entries -contains 'NATIVELIBS/amd64/win/libtsk_jni.dll')) { throw "Packaged Windows JNI missing" }
          Compress-Archive -Path $distDir -DestinationPath 'dist/autopsy-qnxprobe-windows.zip' -Force
          Get-FileHash 'dist/autopsy-qnxprobe-windows.zip' -Algorithm SHA256 | Format-List

      - name: Upload Autopsy Windows build
        uses: actions/upload-artifact@v4
        with:
          name: autopsy-qnxprobe-windows
          path: dist/autopsy-qnxprobe-windows.zip
          if-no-files-found: error

      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "autopsy-qnxprobe-win-${{ github.run_number }}"
          gh release create $tag 'dist/autopsy-qnxprobe-windows.zip' --repo "${{ github.repository }}" --target "${{ github.sha }}" --title "Autopsy QNXProbe Windows $tag" --notes "Automated Windows Autopsy build using Gerd1986/sleuthkit feature/qnxprobe-filesystems. Includes verified Windows x64 JNI JAR. Unsigned test build."
          if ($LASTEXITCODE -ne 0) { throw "GitHub release publishing failed" }
