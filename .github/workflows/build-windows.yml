name: Build Autopsy on Windows

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  TSK_HOME: "${{ github.workspace }}\\sleuthkit"

jobs:
  build:
    runs-on: windows-2025

    steps:
      - name: Checkout Autopsy
        uses: actions/checkout@v4

      - uses: microsoft/setup-msbuild@v2

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Set JDK_HOME
        shell: bash
        run: |
          echo "JDK_HOME=$JAVA_HOME" >> $GITHUB_ENV
          echo "INCLUDE=$INCLUDE;$JAVA_HOME/include;$JAVA_HOME/include/win32" >> $GITHUB_ENV

      - name: Cache Chocolatey packages
        uses: actions/cache@v4
        with:
          path: |
            C:\ProgramData\chocolatey\bin
            C:\ProgramData\chocolatey\lib
          key: choco-nuget-ant

      - name: Install nuget and ant
        run: |
          choco install nuget.commandline -y
          choco install ant --ignore-dependencies -y

      - name: Download custom Sleuth Kit Java release
        shell: pwsh
        run: |
          $url = "https://github.com/Gerd1986/sleuthkit/releases/download/v4.15.0-qnxprobe.8/sleuthkit-java.zip"
          Invoke-WebRequest -Uri $url -OutFile "$env:RUNNER_TEMP\\sleuthkit-java.zip"
          New-Item -ItemType Directory -Force "$env:GITHUB_WORKSPACE\\custom-tsk" | Out-Null
          Expand-Archive -LiteralPath "$env:RUNNER_TEMP\\sleuthkit-java.zip" -DestinationPath "$env:GITHUB_WORKSPACE\\custom-tsk" -Force
          $jars = @(Get-ChildItem "$env:GITHUB_WORKSPACE\\custom-tsk" -Recurse -File -Filter 'sleuthkit-*.jar')
          if ($jars.Count -ne 1) { throw "Expected exactly one Sleuth Kit JAR, found $($jars.Count)" }
          $jar = $jars[0].FullName
          $entries = & jar tf $jar
          if ($LASTEXITCODE -ne 0) { throw "Unable to inspect JAR" }
          if (-not ($entries -contains 'NATIVELIBS/amd64/win/libtsk_jni.dll')) { throw "JAR is missing 64-bit Windows JNI DLL" }
          Write-Host "Verified custom Sleuth Kit JAR: $jar"
          "CUSTOM_TSK_JAR=$jar" >> $env:GITHUB_ENV

      - name: Install custom Sleuth Kit JAR for Autopsy build
        shell: pwsh
        run: |
          $jarName = Split-Path $env:CUSTOM_TSK_JAR -Leaf
          $targets = @(Get-ChildItem "$env:GITHUB_WORKSPACE" -Recurse -File -Filter 'sleuthkit-*.jar' |
            Where-Object { $_.FullName -notlike '*\\custom-tsk\\*' -and $_.FullName -notlike '*\\.git\\*' })
          if ($targets.Count -eq 0) { throw "No existing Autopsy Sleuth Kit JAR found to replace" }
          foreach ($target in $targets) {
            Write-Host "Replacing $($target.FullName) with $jarName"
            Copy-Item -LiteralPath $env:CUSTOM_TSK_JAR -Destination $target.FullName -Force
          }

      - name: Build Autopsy
        run: ant -q -Dbuild.type=RELEASE build-zip

      - name: Run Core unit tests
        run: ant -f Core/build.xml test-unit

      - name: Run KeywordSearch unit tests
        run: ant -f KeywordSearch/build.xml test-unit


      - name: Verify packaged custom JNI and create ZIP
        shell: pwsh
        run: |
          $jar = @(Get-ChildItem dist -Recurse -File -Filter "sleuthkit-*.jar" | Where-Object { $_.FullName -match "autopsy.*modules.*ext" })
          if ($jar.Count -eq 0) { throw "Packaged Autopsy does not contain a Sleuth Kit JAR" }
          foreach ($f in $jar) {
            $entries = & jar tf $f.FullName
            if (-not ($entries -contains "NATIVELIBS/amd64/win/libtsk_jni.dll")) { throw "Packaged JAR missing custom JNI DLL" }
          }
          $dirs = @(Get-ChildItem dist -Directory -Filter "autopsy-*")
          if ($dirs.Count -eq 0) { throw "No build-zip output directory found" }
          Compress-Archive -Path "$($dirs[0].FullName)\\*" -DestinationPath "dist/autopsy-qnxprobe.8-windows.zip" -Force

      - name: Upload Windows Autopsy ZIP
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: autopsy-custom-tsk-windows
          path: dist/*.zip
          if-no-files-found: error
# Trigger Windows build after workflow registration
